<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Localinux</title>
<style>
  @font-face {
    font-family: 'Paperozi';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }

  :root{
    --bg: #050505;
    --dot: rgba(255,255,255,0.16);
    --dot-dim: rgba(255,255,255,0.05);
    --ink: #f2f2f2;
    --ink-dim: rgba(242,242,242,0.55);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow-x: hidden;
  }

  body{
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    color: var(--ink);
    font-family: 'Paperozi', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* dotted grid backdrop */
  .grid-bg{
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, var(--dot) 1.4px, transparent 1.6px);
    background-size: 30px 30px;
    background-position: -15px -15px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 50%, #000 40%, transparent 88%);
            mask-image: radial-gradient(ellipse 75% 65% at 50% 50%, #000 40%, transparent 88%);
    z-index: 0;
  }
  .grid-bg::after{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, var(--dot-dim) 1.4px, transparent 1.6px);
    background-size: 30px 30px;
    background-position: -15px -15px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 50%, transparent 40%, #000 88%);
            mask-image: radial-gradient(ellipse 75% 65% at 50% 50%, transparent 40%, #000 88%);
  }

  main{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  .wordmark{
    font-weight: 500;
    font-size: clamp(2.4rem, 7vw, 4.6rem);
    letter-spacing: -0.01em;
    margin: 0;
    line-height: 1;
    animation: rise 900ms cubic-bezier(.2,.8,.2,1) both;
  }

  .actions{
    display: flex;
    flex-direction: row;
    gap: 12px;
    margin-top: 28px;
  }

  .btn{
    padding: 0.7rem 1.6rem;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.04);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    text-decoration: none;
    white-space: nowrap;
    transition: background 160ms ease, border-color 160ms ease, transform 160ms ease;
  }
  .btn:hover{
    background: rgba(255,255,255,0.10);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-1px);
  }
  .btn:active{
    transform: translateY(0);
  }
  .btn.primary{
    background: var(--ink);
    color: #050505;
    border-color: var(--ink);
  }
  .btn.primary:hover{
    background: #d8d8d8;
    border-color: #d8d8d8;
  }

  .status{
    margin-top: 32px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--ink-dim);
    z-index: 2;
  }
  .status .pulse{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ink);
    animation: blink 2.2s ease-in-out infinite;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px) scale(0.98); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes blink{
    0%, 100%{ opacity: 0.25; }
    50%{ opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce){
    .wordmark{ animation: none; }
    .status .pulse{ animation: none; opacity: 0.6; }
  }

  @media (max-width: 640px){
    .actions{
      flex-direction: column;
      width: 100%;
      max-width: 280px;
    }
    .btn{
      text-align: center;
      width: 100%;
    }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>

  <main>
    <h1 class="wordmark">Localinux</h1>
    <div class="actions">
      <a class="btn primary" href="https://github.com/seuimi/localiunx" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a class="btn" href="https://github.com/seuimi/localiunx" target="_blank" rel="noopener noreferrer">Download</a>
      <a class="btn" href="https://github.com/seuimi/localiunx" target="_blank" rel="noopener noreferrer">Server Download</a>
    </div>
    <div class="status">
      <span class="pulse"></span>
      <span>Open Source</span>
    </div>
  </main>

</body>
</html>
